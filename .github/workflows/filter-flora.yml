name: Filter flora.csv

on:
  push:
    branches: [main]
    paths:
      - 'output/flora.csv'
  workflow_dispatch:

jobs:
  filter-flora:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache R packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-R${{ steps.setup-r.outputs.installed-r-version }}-filter2-${{ hashFiles('**/Rscript') }}
          restore-keys: ${{ runner.os }}-R${{ steps.setup-r.outputs.installed-r-version }}-filter2-

      - name: Install R dependencies
        run: |
          Rscript -e '
            pkgs <- c("readr", "dplyr", "stringr", "httr", "jsonlite", "here")
            install.packages(pkgs)
            missing <- pkgs[!pkgs %in% rownames(installed.packages())]
            if (length(missing)) stop("Failed to install: ", paste(missing, collapse = ", "))
          '

      - name: Run filter script
        run: Rscript R/filter_flora.R

      - name: Auto-commit filtered output
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update filtered flora.csv [automated]"
          file_pattern: "output/flora_filtered.csv output/flora_filter_log.csv"
